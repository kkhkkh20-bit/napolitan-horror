 case 'cash_receipt':state.flags.receiptEarly=true;next('거래 기록은 모두 02:17에 멈춰 있다. 오늘 날짜가 아니다.','screen');return;
 case 'cam_off':state.flags.camera=true;next('전원선을 뽑는 순간 화면 속 나는 창고 쪽을 가리켰다.','blackout');return;
 case 'cam_watch':state.breach++;next('화면 속 내가 고개를 꺾자, 현실의 목이 저절로 돌아간다.','screen');return;
 case 'cam_record':state.flags.camera=true;next('촬영한 사진에는 내 뒤에 또 다른 내가 찍혀 있다.');return;
 case 'phone_hang':next('이름을 말하지 않고 끊었다. 전화선 너머에서 누군가 낮게 웃는다.');return;
 case 'phone_question':state.flags.caller=true;next('“딸 이름이 뭔데요?” 묻자 전화 속 남자는 내 이름을 속삭인다.');return;
 case 'phone_name':state.breach++;next('내 이름을 말하자, 계산대 아래에서 누군가 똑같이 따라 한다.','shadow');return;
 case 'mirror':state.flags.mirror=true;next('유리에 비친 계산대 아래는 비어 있다. 대신 창고 문 안에서 누군가 손을 흔든다.','glass');return;
 case 'look':state.breach+=2;next('아래에 웅크린 사람이 보인다. 그 사람은 정확히 나와 같은 얼굴이다.','shadow');return;
 case 'ignore':next('대답하지 않자 목소리가 한참 동안 내 이름을 부른다.');return;
 case 'child_ask':state.flags.child=true;next('아이는 “진짜 사람은 문을 두드려요. 세 번씩.”이라고 말한다.');return;
 case 'child_out':next('아이는 나가면서 말을 남긴다. “그럼 안쪽 사람은 어떡해요?”');return;
 case 'child_name':state.breach++;next('아이가 내 이름을 부르자 매장 안의 모든 냉장고가 함께 대답한다.','blackout');return;
 case 'receipt':state.flags.receipt=true;safeStore();showSheet('<p class="sheetNote">계산대에서 출력된 영수증의 뒷면이다.</p><div class="rule">「나는 계산대 아래에 없어.<br>다른 나에게 이름 말하지 마.<br>문 안에서 세 번 두드리면 대답해 줘.」</div><p class="sheetNote">단서 획득: 영수증</p>');return;
 case 'stockcheck':state.flags.stock=true;safeStore();showSheet('<p class="sheetNote">문턱의 흰 선을 관찰했다.</p><div class="rule">손잡이 아래에는 비상 해제 단추가 있다. 창고 문은 안쪽에서 열 수 없다. <br><br>똑, 똑, 똑. 잠깐의 침묵. 그리고 다시 세 번.</div><p class="sheetNote">단서 획득: 창고 문턱</p>');return;
 case 'escape':ending('replaced');return;
 case 'rescue':if(state.flags.receipt&&state.flags.stock&&state.flags.forgedProof&&(state.flags.mirror||state.flags.cameraProof)&&state.breach<=2)ending('true');else ending('trapped');return;
 case 'wait':ending(state.flags.receipt?'evidence':state.breach>=3?'replaced':'solo');return;
 case 'breaker':ending('loop');return;
 }
}
$('titlePhoto').src=IMAGES.exterior;
$('resumeBtn').addEventListener('click',()=>{const s=saved();if(s){SFX.revive();state=s;selectStory(state.episode||0);render();SFX.scene(state.scene,state.episode,true)}});
$('again').addEventListener('click',reset);
$('nextEpisodeBtn').addEventListener('click',()=>startEpisode((state.episode||0)+1));
$('home').addEventListener('click',()=>{SFX.play('tap');state.mode='title';safeStore();render()});
$('rulesBtn').addEventListener('click',()=>showSheet(rulesMarkup()));
$('notesBtn').addEventListener('click',()=>showSheet(state.episode===0?noteMarkup():'<div class="paperHeading">조사 기록</div><p class="sheetNote">다음 장소로 가기 전에 주변을 관찰하세요.</p>'));
$('dialogueBox').addEventListener('click',advance);$('photoWrap').addEventListener('click',advance);
$('sheetClose').addEventListener('click',()=>{SFX.play('tap');$('sheet').hidden=true;render()});$('sheet').addEventListener('click',e=>{if(e.target===$('sheet')){$('sheet').hidden=true;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('sheet').hidden){$('sheetClose').click();return}if(e.key===' '&&state.mode==='play'&&$('sheet').hidden){e.preventDefault();advance()}});
function soundLabel(){const text=SFX.enabled?'소리 켜짐':'소리 꺼짐';$('soundToggle').textContent=text;$('soundTitle').textContent=text;$('soundToggle').setAttribute('aria-label',text)}
function toggleAudio(){SFX.toggle();soundLabel()}
$('soundTitle').addEventListener('click',toggleAudio);
$('soundToggle').addEventListener('click',toggleAudio);
document.addEventListener('pointerdown',()=>SFX.unlock(),{passive:true});
soundLabel();render();
})();
</script></body></html>
